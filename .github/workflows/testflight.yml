name: Build and Upload to TestFlight

# Roda só quando você pedir (aba Actions -> Build and Upload to TestFlight ->
# Run workflow), nunca automaticamente em cada push — subir pro App Store
# Connect é uma ação deliberada, não algo pra disparar sem querer.
on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Importa o certificado de distribuição + provisioning profile pra um
      # keychain temporário só desta execução (apagado no fim, ver o último
      # step). Receita oficial do GitHub:
      # https://docs.github.com/en/actions/use-cases-and-examples/deploying/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

          # Diagnóstico de tamanho/formato só (nunca imprime o profile em si)
          # — um .mobileprovision típico tem alguns KB; se vier vazio/muito
          # pequeno, o segredo BUILD_PROVISION_PROFILE_BASE64 está errado.
          echo "Provisioning profile decodificado: $(wc -c < "$PP_PATH") bytes"

          # UUID do profile, pro Archive referenciar via PROVISIONING_PROFILE
          # (assinatura manual, ver comentário no step Archive abaixo). Grava
          # em arquivo em vez de pipe direto pro PlistBuddy, pra poder checar
          # se o `security cms -D` (que decodifica o CMS/PKCS7 assinado pela
          # Apple) realmente produziu algo antes de tentar ler o UUID dele.
          PROFILE_PLIST="$RUNNER_TEMP/build_pp.plist"
          security cms -D -i "$PP_PATH" -o "$PROFILE_PLIST"
          echo "Profile plist decodificado: $(wc -c < "$PROFILE_PLIST") bytes"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          echo "Provisioning profile UUID: $PROFILE_UUID"
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # A chave da App Store Connect API autentica o xcodebuild direto com a
      # Apple (renovar profile, e depois enviar o build) — sem precisar de
      # Apple ID + senha de app.
      - name: Install App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Diagnóstico só de FORMATO/TAMANHO — nunca imprime o valor de nenhum
      # secret. Serve pra achar espaço/quebra de linha extra colada sem
      # querer, ou um .p8 que não decodificou certo, sem chutar às cegas.
      - name: Sanity-check API key secrets (no values printed)
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          echo "Key ID length (esperado ~10 chars, sem espaço/quebra): ${#API_KEY_ID}"
          echo "Issuer ID length (esperado 36 chars, formato UUID): ${#API_ISSUER_ID}"
          echo "p8 file size in bytes (.p8 típico ~230-350 bytes):"
          wc -c < "$API_KEY_PATH"
          echo "Primeira e última linha do .p8 decodificado (tem que ser BEGIN/END PRIVATE KEY):"
          head -n 1 "$API_KEY_PATH"
          tail -n 1 "$API_KEY_PATH"

      # O projeto usa CODE_SIGN_STYLE=Automatic sem CODE_SIGN_IDENTITY
      # explícito em nenhuma configuração. Automatic sempre assina com a
      # identidade de Desenvolvimento (é assim que a Apple projetou:
      # distribuição só entra no passo de export) — por isso o run anterior
      # falhou pedindo um certificado "iOS Development" que nunca foi
      # importado (só o de Distribuição está no keychain deste runner).
      # Forçar CODE_SIGN_IDENTITY="Apple Distribution" sem mudar o estilo
      # também falha ("conflicting provisioning settings"), porque Automatic
      # e uma identidade de Distribuição são incompatíveis entre si.
      # Solução: assinatura manual só neste step, usando exatamente o
      # certificado + profile já importados (nenhuma negociação com a Apple
      # é necessária aqui — só o export/upload logo abaixo precisa da API key).
      - name: Archive
        run: |
          xcodebuild archive \
            -project SoulGrid.xcodeproj \
            -scheme SoulGrid \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SoulGrid.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID"

      # exportArchive com destination=upload no ExportOptions.plist exporta
      # E envia pro App Store Connect num passo só.
      - name: Export and upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SoulGrid.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true
